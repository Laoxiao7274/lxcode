<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP：本地应用，零远程内容。script 的 'unsafe-inline' 供 dev 模式
         @vitejs/plugin-react 的 RefreshRuntime inline preamble；style 的
         'unsafe-inline' 是 React inline style + gsap 直接改元素样式所必需。
         connect 的 ws:/wss: 允许任意主机——连接远程后端（局域网/公网隧道）
         是核心功能，地址由用户在连接管理里配置；data 面只有 token 参数，
         无静态远程资源。worker-src 的 blob: 只给 dev 模式用：vite 的 dev
         client 在 HMR socket 断开后会用 blob 造一个 SharedWorker 去轮询
         服务端（/@vite/client 的 waitForSuccessfulPing），挡掉它页面就再也
         不会自动 reload，只能手动刷新。单独写在 worker-src 而不是放宽
         script-src——blob 仍然不能当脚本执行。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://127.0.0.1:7789 http://localhost:7789; font-src 'self' data:; connect-src 'self' ws: wss:" />
    <title>lxcode · 智能体工作台</title>
    <!-- 主题防闪（必须内联在首帧前）：读持久化偏好（shared/theme.ts 的
         THEME_KEY，两边必须一致）落 html data-theme 与背景兜底色。
         auto=跟随系统（dark 判定走 matchMedia）；style.background 是
         CSS 加载前的兜底——亮色系统下不再白闪、暗色系统下不再闪白。
         异常（隐私模式禁 localStorage 等）静默回落：亮色 token + auto。 -->
    <script>
      (function () {
        var pref = "system";
        try {
          var v = localStorage.getItem("lxcode.theme");
          if (v === "dark" || v === "light" || v === "system") pref = v;
        } catch (e) { /* 无 localStorage——保持跟随系统 */ }
        var dark = pref === "dark" || (pref === "system" &&
          window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", pref === "system" ? "auto" : pref);
        document.documentElement.style.background = dark ? "#18181c" : "#ffffff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
