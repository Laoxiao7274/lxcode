[package]
name = "lxcode"
version = "0.1.0"
description = "lxcode 智能体工作台"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认不启用自定义协议（开发时直接 localhost）
default = []
